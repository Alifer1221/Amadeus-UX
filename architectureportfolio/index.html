<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Architecture Portfolio — Louis Amadeus Arteaga</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="apple-touch-icon" href="../assets/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

    <!-- Home 3D Spline Viewer -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.29/build/spline-viewer.js"></script>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        :root {
            --bg: #0a0a0c;
            --text: #f5f5f7;
            --muted: #a1a1aa;
            --accent: #8A2BE2;
            --glass-bg: rgba(15, 15, 20, 0.68);
            --glass-border: rgba(255, 255, 255, 0.12);
            --manrope: 'Manrope', sans-serif;
            --sans: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background-color: #000000;
            color: var(--text);
            font-family: var(--sans);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Fixed Home Background Layer (Spline 3D on desktop + Home wave canvas fallback/mobile) */
        .home-bg-layer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: linear-gradient(180deg, #000000 0%, #151515 100%);
        }

        #home-wave-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .spline-bg-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 118vw;
            height: 118vh;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.9s ease;
            pointer-events: none;
        }

        .spline-bg-wrapper.ready {
            opacity: 1;
        }

        .spline-bg-wrapper spline-viewer {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .spline-bg-wrapper {
                display: none;
            }
        }

        /* Floating Minimal Dark Glass Top Header */
        .portfolio-topbar {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: min(94vw, 1120px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 10px 18px;
            border-radius: 999px;
            background: var(--glass-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        }

        .brand-block {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
        }

        .brand-title {
            font-family: var(--manrope);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #ffffff;
            white-space: nowrap;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-subtitle span {
            color: #b57bff;
            font-weight: 500;
        }

        .toolbar-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-family: var(--manrope);
            font-size: 0.8rem;
            font-weight: 600;
            height: 34px;
            min-width: 34px;
            padding: 0 10px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }

        .ctrl-btn:hover:not(:disabled) {
            background: rgba(138, 43, 226, 0.28);
            border-color: rgba(181, 123, 255, 0.55);
            transform: translateY(-1px);
        }

        .ctrl-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .ctrl-btn.primary {
            background: linear-gradient(135deg, #6b21a8, #8A2BE2);
            color: #ffffff;
            border-color: transparent;
            padding: 0 14px;
        }

        .ctrl-btn.primary:hover {
            background: linear-gradient(135deg, #7e22ce, #9b4dff);
            box-shadow: 0 6px 20px rgba(138, 43, 226, 0.45);
        }

        .page-indicator {
            font-family: var(--manrope);
            font-size: 0.8rem;
            font-weight: 600;
            color: #d4d4d8;
            padding: 0 8px;
            white-space: nowrap;
            user-select: none;
        }

        .divider {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.14);
            margin: 0 2px;
        }

        /* Main PDF Stage */
        .viewer-shell {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            padding: 96px 20px 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Loading State */
        .loader-card {
            margin: auto;
            width: min(92vw, 440px);
            padding: 36px 30px;
            border-radius: 24px;
            background: rgba(18, 18, 24, 0.78);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
            text-align: center;
        }

        .loader-card.hidden {
            display: none;
        }

        .loader-label {
            font-family: var(--manrope);
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .loader-sub {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .progress-track {
            width: 100%;
            height: 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        .progress-fill {
            width: 8%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #663399, #8A2BE2, #c084fc);
            transition: width 0.25s ease;
        }

        .error-box {
            display: none;
            margin-top: 18px;
            font-size: 0.85rem;
            color: #fca5a5;
        }

        /* Pages Container */
        #pdf-pages {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .pdf-page-card {
            position: relative;
            background: #ffffff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 26px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
            max-width: 100%;
        }

        .pdf-page-card canvas,
        .pdf-page-card video {
            display: block;
            width: 100%;
            height: auto;
        }

        .pdf-page-card.video-slide {
            background: #000000;
        }

        .page-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #71717a;
            font-family: var(--manrope);
            font-size: 0.85rem;
            background: rgba(24, 24, 30, 0.85);
            min-height: 360px;
        }

        .page-badge {
            position: absolute;
            bottom: 12px;
            right: 14px;
            font-family: var(--manrope);
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.88);
            background: rgba(15, 15, 20, 0.72);
            backdrop-filter: blur(8px);
            padding: 3px 9px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .portfolio-topbar {
                top: 12px;
                padding: 8px 12px;
                border-radius: 20px;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            .brand-block {
                width: 100%;
                justify-content: center;
            }

            .brand-subtitle {
                display: none;
            }

            .viewer-shell {
                padding: 112px 10px 44px;
            }

            #pdf-pages {
                gap: 16px;
            }

            .pdf-page-card {
                border-radius: 10px;
            }

            .ctrl-btn {
                height: 32px;
                min-width: 32px;
                padding: 0 8px;
                font-size: 0.76rem;
            }

            .divider {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Home Background Script: Exact Spline 3D particles (with 3D text hidden) + Home Wave Canvas -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Exact Home Wave Canvas (runs immediately and stays active on mobile)
            const canvas = document.getElementById('home-wave-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let lines = [];
            let splineLoaded = false;

            const config = {
                lineCount: 25,
                baseAmplitude: 40,
                baseGap: 8,
                baseFrequency: 0.003,
                speed: 0.0008,
                currentAmplitude: 0,
                currentGap: 0
            };

            function initLines() {
                lines = [];
                const totalHeight = config.lineCount * config.currentGap;
                const startY = (height / 2) + (totalHeight * 0.15);
                for (let i = 0; i < config.lineCount; i++) {
                    lines.push({
                        y: startY + (i * config.currentGap),
                        phase: i * 0.2
                    });
                }
            }

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                let scaleFactor = width / 450;
                scaleFactor = Math.min(Math.max(scaleFactor, 0.5), 1.4);
                config.currentAmplitude = config.baseAmplitude * scaleFactor;
                config.currentGap = config.baseGap * scaleFactor;
                initLines();
            }

            function drawWaves() {
                if (splineLoaded && window.innerWidth > 768) {
                    requestAnimationFrame(drawWaves);
                    return;
                }

                const gradientBg = ctx.createLinearGradient(0, 0, 0, height);
                gradientBg.addColorStop(0, '#000000');
                gradientBg.addColorStop(1, '#151515');
                ctx.fillStyle = gradientBg;
                ctx.fillRect(0, 0, width, height);

                const time = Date.now() * config.speed;

                lines.forEach((line, index) => {
                    ctx.beginPath();
                    const alpha = 1 - (index / config.lineCount);
                    const saturation = 50 + index;
                    ctx.strokeStyle = `hsla(260, ${saturation}%, 70%, ${alpha})`;
                    ctx.lineWidth = 1.5;

                    for (let x = 0; x <= width; x += 2) {
                        const dist = Math.abs(width / 2 - x);
                        const scale = Math.max(0, 1 - Math.pow(dist / (width * 0.6), 2));
                        const wave1 = Math.sin(x * config.baseFrequency + time + line.phase);
                        const wave2 = Math.cos(x * (config.baseFrequency * 0.5) - time);
                        const combinedWave = (wave1 + wave2 * 0.3) * config.currentAmplitude * scale;
                        ctx.lineTo(x, line.y + combinedWave);
                    }
                    ctx.stroke();
                });

                requestAnimationFrame(drawWaves);
            }

            window.addEventListener('resize', resize);
            resize();
            drawWaves();

            // 2. Exact Home 3D Spline Particles (with 3D text objects hidden cleanly)
            const splineViewer = document.getElementById('home-spline-bg');
            const splineWrapper = document.getElementById('spline-bg-wrapper');

            function hideSpline3DText() {
                if (!splineViewer || !splineViewer._spline || !splineViewer._spline._scene) return false;
                const splineApp = splineViewer._spline;
                const scene = splineApp._scene;

                scene.traverse((obj) => {
                    const isTextGeo = obj.geometry && obj.geometry.userData && obj.geometry.userData.type === 'TextGeometry';
                    const isHeadingName = obj.name === 'Heading' || obj.name === 'Subheading' || obj.name === 'Text';
                    if (isTextGeo || isHeadingName) {
                        obj.visible = false;
                    }
                });

                if (typeof scene.markNeedsUpdateRendererDirty === 'function') {
                    scene.markNeedsUpdateRendererDirty();
                }
                if (typeof splineApp._requestRenderAutoMode === 'function') {
                    splineApp._requestRenderAutoMode();
                }
                if (typeof splineApp.requestRender === 'function') {
                    splineApp.requestRender();
                }
                return true;
            }

            if (splineViewer && window.innerWidth > 768) {
                const revealSpline = () => {
                    hideSpline3DText();
                    setTimeout(() => {
                        hideSpline3DText();
                        splineLoaded = true;
                        if (splineWrapper) splineWrapper.classList.add('ready');
                    }, 120);
                };

                splineViewer.addEventListener('load', revealSpline, { once: true });

                // Fallback poll in case load fired early
                let tries = 0;
                const poll = setInterval(() => {
                    tries++;
                    if (splineLoaded || tries > 40) {
                        clearInterval(poll);
                        return;
                    }
                    if (splineViewer._spline && splineViewer._spline._scene) {
                        clearInterval(poll);
                        revealSpline();
                    }
                }, 250);
            }
        });
    </script>

    <!-- PDF.js Progressive High-DPI Renderer -->
    <script>
        (function () {
            const PDF_URL = 'https://raw.githubusercontent.com/Amadeusguitarte/Portfolio/main/Louis_Amadeus_Arteaga_Selected_Works_Portfolio_REVISED.pdf';

            const pagesContainer = document.getElementById('pdf-pages');
            const loaderCard = document.getElementById('loader-card');
            const loaderSub = document.getElementById('loader-sub');
            const progressFill = document.getElementById('progress-fill');
            const errorBox = document.getElementById('error-box');
            const pageIndicator = document.getElementById('page-indicator');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const btnZoomIn = document.getElementById('btn-zoom-in');
            const btnZoomOut = document.getElementById('btn-zoom-out');

            if (typeof pdfjsLib === 'undefined') {
                loaderSub.textContent = 'Viewer library unavailable.';
                errorBox.style.display = 'block';
                return;
            }

            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            let pdfDoc = null;
            let totalSlides = 0;
            let slideItems = [];
            let currentPage = 1; // 1-based display index
            let zoomMultiplier = 1.0;
            const renderedPages = new Map();
            let pageCards = [];
            let renderObserver = null;
            let videoObserver = null;
            let isProgrammaticScroll = false;
            let scrollLockTimer = null;

            function buildSlideItems(numPages) {
                // Keep cover (1), move pages 9-13 to first project with looping video between displayed page 3 & 4,
                // then original pages 2-8 to second project, then 14..end
                const items = [];
                if (numPages >= 13) {
                    items.push({ type: 'pdf', pdfPage: 1 });
                    items.push({ type: 'pdf', pdfPage: 9 });
                    items.push({ type: 'pdf', pdfPage: 10 });
                    items.push({ type: 'video', src: 'daylight_study_2.mp4' });
                    items.push({ type: 'pdf', pdfPage: 11 });
                    items.push({ type: 'video', src: 'daylight_study_3.mp4' });
                    items.push({ type: 'pdf', pdfPage: 12 });
                    items.push({ type: 'pdf', pdfPage: 13 });
                    items.push({ type: 'pdf', pdfPage: 2 });
                    items.push({ type: 'video', src: 'daylight_study_5.mp4' });
                    for (let p = 3; p <= 8; p++) items.push({ type: 'pdf', pdfPage: p });
                    // Move displayed slides 20 & 21 (PDF pages 17 & 18) before displayed slide 17 (PDF page 14)
                    if (numPages >= 18) {
                        items.push({ type: 'pdf', pdfPage: 17 });
                        items.push({ type: 'pdf', pdfPage: 18 });
                        items.push({ type: 'video', src: 'kitchen_redesign.mp4' });
                        items.push({ type: 'pdf', pdfPage: 14 });
                        items.push({ type: 'pdf', pdfPage: 15 });
                        items.push({ type: 'pdf', pdfPage: 16 });
                        for (let p = 19; p <= numPages; p++) items.push({ type: 'pdf', pdfPage: p });
                    } else {
                        for (let p = 14; p <= numPages; p++) items.push({ type: 'pdf', pdfPage: p });
                    }
                    return items;
                }
                for (let p = 1; p <= numPages; p++) {
                    items.push({ type: 'pdf', pdfPage: p });
                    if (p === 3) items.push({ type: 'video', src: 'daylight_study_2.mp4' });
                }
                return items;
            }

            function getTargetWidth() {
                const maxBase = Math.min(window.innerWidth - (window.innerWidth <= 768 ? 20 : 64), 1120);
                return Math.max(280, Math.round(maxBase * zoomMultiplier));
            }

            function updateControls() {
                pageIndicator.textContent = totalSlides ? `${currentPage} / ${totalSlides}` : '— / —';
                btnPrev.disabled = currentPage <= 1;
                btnNext.disabled = currentPage >= totalSlides;
            }

            function syncActivePageFromScroll() {
                if (isProgrammaticScroll || !pageCards.length) return;
                const viewportCenter = window.innerHeight / 2;
                let closestIdx = currentPage;
                let closestDist = Infinity;

                for (let i = 0; i < pageCards.length; i++) {
                    const rect = pageCards[i].getBoundingClientRect();
                    const cardCenter = rect.top + rect.height / 2;
                    const dist = Math.abs(cardCenter - viewportCenter);
                    if (dist < closestDist) {
                        closestDist = dist;
                        closestIdx = i + 1;
                    }
                }

                if (closestIdx !== currentPage) {
                    currentPage = closestIdx;
                    updateControls();
                }
            }

            let scrollRafPending = false;
            window.addEventListener('scroll', () => {
                if (isProgrammaticScroll || scrollRafPending) return;
                scrollRafPending = true;
                requestAnimationFrame(() => {
                    scrollRafPending = false;
                    syncActivePageFromScroll();
                });
            }, { passive: true });

            function scrollToPage(displayIndex) {
                if (!totalSlides) return;
                const clamped = Math.max(1, Math.min(totalSlides, displayIndex));
                const card = pageCards[clamped - 1];
                if (!card) return;

                currentPage = clamped;
                updateControls();

                // Ensure target & adjacent PDF pages are rendered (or play video if video slide)
                if (card.dataset.slideType === 'pdf') {
                    renderPage(Number(card.dataset.pdfPage), card);
                } else if (card.dataset.slideType === 'video') {
                    const vid = card.querySelector('video');
                    if (vid) vid.play().catch(() => {});
                }
                if (pageCards[clamped] && pageCards[clamped].dataset.slideType === 'pdf') {
                    renderPage(Number(pageCards[clamped].dataset.pdfPage), pageCards[clamped]);
                }

                isProgrammaticScroll = true;
                clearTimeout(scrollLockTimer);
                scrollLockTimer = setTimeout(() => {
                    isProgrammaticScroll = false;
                }, 700);

                const rect = card.getBoundingClientRect();
                const topBarOffset = window.innerWidth <= 768 ? 104 : 84;
                const availableH = window.innerHeight - topBarOffset - 24;
                let targetY;
                if (rect.height < availableH) {
                    // Center slide comfortably below the floating topbar
                    const centerOffset = topBarOffset + (availableH - rect.height) / 2;
                    targetY = rect.top + window.scrollY - centerOffset;
                } else {
                    targetY = rect.top + window.scrollY - topBarOffset;
                }

                window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
            }

            async function renderPage(pdfPageNum, card) {
                if (!pdfDoc || !pdfPageNum || renderedPages.get(pdfPageNum) === zoomMultiplier) return;
                renderedPages.set(pdfPageNum, zoomMultiplier);

                try {
                    const page = await pdfDoc.getPage(pdfPageNum);
                    const unscaled = page.getViewport({ scale: 1 });
                    const targetWidth = getTargetWidth();
                    const cssScale = targetWidth / unscaled.width;
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);

                    const viewport = page.getViewport({ scale: cssScale * dpr });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d', { alpha: false });

                    canvas.width = Math.floor(viewport.width);
                    canvas.height = Math.floor(viewport.height);
                    canvas.style.width = `${Math.floor(unscaled.width * cssScale)}px`;
                    canvas.style.height = `${Math.floor(unscaled.height * cssScale)}px`;

                    card.style.width = `${Math.floor(unscaled.width * cssScale)}px`;

                    await page.render({ canvasContext: ctx, viewport }).promise;

                    const badge = card.querySelector('.page-badge');
                    card.innerHTML = '';
                    card.appendChild(canvas);
                    if (badge) card.appendChild(badge);
                } catch (err) {
                    console.error('Error rendering page', pdfPageNum, err);
                }
            }

            async function buildPages() {
                pagesContainer.innerHTML = '';
                renderedPages.clear();
                pageCards = [];

                if (renderObserver) renderObserver.disconnect();
                if (videoObserver) videoObserver.disconnect();

                const firstPdfItem = slideItems.find(item => item.type === 'pdf');
                const firstPage = await pdfDoc.getPage(firstPdfItem ? firstPdfItem.pdfPage : 1);
                const firstViewport = firstPage.getViewport({ scale: 1 });
                const targetWidth = getTargetWidth();
                const estimatedHeight = Math.round((firstViewport.height / firstViewport.width) * targetWidth);

                renderObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && entry.target.dataset.slideType === 'pdf') {
                            const pdfPageNum = Number(entry.target.dataset.pdfPage);
                            renderPage(pdfPageNum, entry.target);
                        }
                    });
                }, { rootMargin: '800px 0px' });

                videoObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const vid = entry.target.querySelector('video');
                        if (!vid) return;
                        if (entry.isIntersecting) {
                            vid.play().catch(() => {});
                        } else {
                            vid.pause();
                        }
                    });
                }, { threshold: 0.15 });

                for (let idx = 0; idx < slideItems.length; idx++) {
                    const displayIndex = idx + 1;
                    const item = slideItems[idx];

                    const card = document.createElement('div');
                    card.className = item.type === 'video' ? 'pdf-page-card video-slide' : 'pdf-page-card';
                    card.dataset.displayIndex = String(displayIndex);
                    card.dataset.slideType = item.type;
                    card.style.width = `${targetWidth}px`;

                    const badge = document.createElement('span');
                    badge.className = 'page-badge';
                    badge.textContent = `${displayIndex} / ${totalSlides}`;

                    if (item.type === 'video') {
                        const video = document.createElement('video');
                        video.src = item.src;
                        video.autoplay = true;
                        video.loop = true;
                        video.muted = true;
                        video.playsInline = true;
                        video.preload = 'auto';
                        video.setAttribute('autoplay', '');
                        video.setAttribute('loop', '');
                        video.setAttribute('muted', '');
                        video.setAttribute('playsinline', '');
                        video.setAttribute('disablePictureInPicture', '');
                        card.appendChild(video);
                        card.appendChild(badge);
                        videoObserver.observe(card);
                    } else {
                        card.dataset.pdfPage = String(item.pdfPage);
                        const placeholder = document.createElement('div');
                        placeholder.className = 'page-placeholder';
                        placeholder.style.height = `${estimatedHeight}px`;
                        placeholder.textContent = `Page ${displayIndex}`;
                        card.appendChild(placeholder);
                        card.appendChild(badge);
                        renderObserver.observe(card);
                    }

                    pagesContainer.appendChild(card);
                    pageCards.push(card);
                }

                if (pageCards[0] && pageCards[0].dataset.slideType === 'pdf') {
                    renderPage(Number(pageCards[0].dataset.pdfPage), pageCards[0]);
                }
                if (pageCards[1] && pageCards[1].dataset.slideType === 'pdf') {
                    renderPage(Number(pageCards[1].dataset.pdfPage), pageCards[1]);
                }
                updateControls();
            }

            btnPrev.addEventListener('click', () => scrollToPage(currentPage - 1));
            btnNext.addEventListener('click', () => scrollToPage(currentPage + 1));

            btnZoomIn.addEventListener('click', () => {
                if (!pdfDoc) return;
                zoomMultiplier = Math.min(1.6, +(zoomMultiplier + 0.15).toFixed(2));
                buildPages();
            });

            btnZoomOut.addEventListener('click', () => {
                if (!pdfDoc) return;
                zoomMultiplier = Math.max(0.65, +(zoomMultiplier - 0.15).toFixed(2));
                buildPages();
            });

            window.addEventListener('keydown', (e) => {
                if (!pdfDoc) return;
                if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                    scrollToPage(currentPage + 1);
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    scrollToPage(currentPage - 1);
                }
            });

            let resizeTimer;
            window.addEventListener('resize', () => {
                if (!pdfDoc) return;
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => buildPages(), 300);
            });

            const loadingTask = pdfjsLib.getDocument({
                url: PDF_URL,
                cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                cMapPacked: true
            });

            loadingTask.onProgress = (progress) => {
                if (progress.total > 0) {
                    const pct = Math.min(99, Math.round((progress.loaded / progress.total) * 100));
                    progressFill.style.width = `${pct}%`;
                    loaderSub.textContent = `Loading document... ${pct}%`;
                }
            };

            loadingTask.promise.then(async (doc) => {
                pdfDoc = doc;
                slideItems = buildSlideItems(doc.numPages);
                totalSlides = slideItems.length;
                progressFill.style.width = '100%';
                loaderCard.classList.add('hidden');
                await buildPages();
            }).catch((err) => {
                console.error('PDF load error:', err);
                loaderSub.textContent = 'Unable to load preview.';
                errorBox.style.display = 'block';
            });
        })();
    </script>
</body>

</html>
